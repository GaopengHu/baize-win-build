# 今点通 UOS/统信/Kylin/麒麟 ARM64 .deb 一键构建
#
# 基于 Dockerfile.uos-arm (Debian 10, GLIBC 2.28 + ARM64 交叉编译工具链)。
# 使用命名卷隔离 ARM64 .node 二进制（与 x86_64 .node 不兼容）。
# 构建产物直接写入宿主 release/ 目录。
#
# 用法:
#   # 首次或 Docker 镜像更新后（apt 源为国内镜像，几分钟即可完成）
#   docker-compose -f docker/docker-compose.uos-arm.yml build
#
#   # 构建（重复构建跳过镜像层，速度更快）
#   docker-compose -f docker/docker-compose.uos-arm.yml run --rm build
#
#   # 只重打 .deb（lockfile 未变时跳过 npm install）
#   docker-compose -f docker/docker-compose.uos-arm.yml run --rm build bash -c "node scripts/build-linux-arm64.mjs"
#

services:
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile.uos-arm
      args:
        UID: 1000
        GID: 1000
    image: zhinengti-linux-builder:uos-arm
    container_name: zhinengti-linux-build-arm
    working_dir: /app
    # 用 root 运行，避免命名卷 /app/node_modules 与 bind mount 宿主目录的权限问题
    # (mac/win 版同样用 root；否则 npm install 报 EACCES)
    user: root
    volumes:
      # 项目源码 (挂载宿主目录, 构建产物写入宿主 release/)
      - ..:/app
      # node_modules: 命名卷隔离 ARM64 .node 二进制（不污染宿主 x64 node_modules）
      - zhinengti-uos-arm-node-modules:/app/node_modules
      # resources/node: 数万个小文件走 Windows bind mount 极慢且易报 EACCES，用命名卷
      - zhinengti-uos-arm-node-resources:/app/resources/node
      # npm 全局缓存 (共享宿主 ~/.npm)
      - ~/.npm:/home/builder/.npm
      # Electron 二进制缓存 (共享宿主 ~/.cache/electron)
      - ~/.cache/electron:/home/builder/.cache/electron
      # electron-builder 缓存 (linux 工具链)
      - ~/.cache/electron-builder:/home/builder/.cache/electron-builder
      # node-gyp headers 缓存（Electron headers 与架构无关，失败重试/重复构建不再重复下载）
      - zhinengti-uos-arm-node-gyp-cache:/home/builder/.cache/node-gyp
      # vite 构建缓存（renderer/main bundle 增量）
      - zhinengti-uos-arm-vite-cache:/app/node_modules/.vite-build
    # 使用宿主网络，解决容器内 DNS 解析慢的问题（同 mac 方案）
    network_mode: host
    environment:
      - INSIDE_DOCKER=true
      # root 运行时 HOME 默认 /root，指向 /home/builder 才能命中缓存卷
      - HOME=/home/builder
      - ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
      - ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
    command: >
      bash -c "
        echo '=== 今点通 UOS/Kylin ARM64 .deb Build Container ===' &&
        if [ -f node_modules/.install-stamp ] && cmp -s package-lock.json node_modules/.install-stamp; then
          echo 'Step 1: npm install SKIPPED (package-lock.json unchanged)';
        else
          echo 'Step 1: npm install' &&
          npm install --ignore-scripts --no-fund --no-audit --legacy-peer-deps &&
          npx patch-package &&
          cp package-lock.json node_modules/.install-stamp;
        fi &&
        echo 'Step 2: Download Node.js binaries (incl. linux-arm64)' &&
        OPEN_COWORK_DOWNLOAD_ALL_NODE_BINARIES=1 node scripts/download-node.js &&
        echo 'Step 4: Cross-compile better-sqlite3 for ARM64' &&
        node scripts/cross-compile-better-sqlite3.mjs &&
        echo 'Step 5: Build .deb for ARM64' &&
        node scripts/build-linux-arm64.mjs
      "

volumes:
  zhinengti-uos-arm-node-modules:
  zhinengti-uos-arm-node-resources:
  zhinengti-uos-arm-vite-cache:
  zhinengti-uos-arm-node-gyp-cache:
