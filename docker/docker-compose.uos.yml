# 今点通 UOS/统信/Kylin/麒麟 .deb 一键构建
#
# 基于 Dockerfile.uos (Debian 10, GLIBC 2.28)。
# 构建产物直接写入宿主 release/ 目录。
#
# 用法:
#   docker-compose -f docker/docker-compose.uos.yml build
#   docker-compose -f docker/docker-compose.uos.yml run --rm build
#   # 只重打 .deb（lockfile 未变时跳过 npm install，最省时间）:
#   docker-compose -f docker/docker-compose.uos.yml run --rm build bash -c "node scripts/build-linux-deb.mjs"
#

services:
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile.uos
      args:
        UID: 1000
        GID: 1000
    image: zhinengti-linux-builder:uos
    container_name: zhinengti-linux-build
    working_dir: /app
    # 用 root 运行，避免命名卷 /app/node_modules 与 bind mount 宿主目录的权限问题
    # (mac/win 版同样用 root；否则 npm install 报 EACCES)
    user: root
    volumes:
      # 项目源码 (挂载宿主目录, 构建产物写入宿主 release/)
      - ..:/app
      # node_modules: 用独立命名卷（Windows Docker Desktop 上 bind mount 极慢）
      - zhinengti-uos-node-modules:/app/node_modules
      # resources/node: 数万个小文件走 Windows bind mount 极慢且易报 EACCES，用命名卷
      - zhinengti-uos-node-resources:/app/resources/node
      # npm 全局缓存 (共享宿主 ~/.npm)
      - ~/.npm:/home/builder/.npm
      # Electron 二进制缓存 (共享宿主 ~/.cache/electron)
      - ~/.cache/electron:/home/builder/.cache/electron
      # electron-builder 缓存 (linux 工具链)
      - ~/.cache/electron-builder:/home/builder/.cache/electron-builder
      # vite 构建缓存（renderer/main bundle 增量）
      - zhinengti-uos-vite-cache:/app/node_modules/.vite-build
      # node headers 缓存（cross-compile-better-sqlite3.mjs --nodedir 用，跨构建复用）
      - zhinengti-uos-node-gyp-cache:/home/builder/.cache/node-gyp
    environment:
      - INSIDE_DOCKER=true
      # root 运行时 HOME 默认 /root，指向 /home/builder 才能命中缓存卷
      - HOME=/home/builder
      - ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
      - ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
      # 覆盖 Dockerfile 中的 REBUILD_NATIVE=1，使用 Step 2 手动 rebuild
      - REBUILD_NATIVE=
    command: >
      bash -c "
        echo '=== 今点通 UOS/Kylin .deb Build Container ===' &&
        if [ -f node_modules/.install-stamp ] && cmp -s package-lock.json node_modules/.install-stamp; then
          echo 'Step 1: npm install SKIPPED (package-lock.json unchanged)';
        else
          echo 'Step 1: npm install' &&
          npm install --ignore-scripts --no-fund --no-audit --legacy-peer-deps &&
          npx patch-package &&
          cp package-lock.json node_modules/.install-stamp;
        fi &&
        echo 'Step 2: Download Node.js binaries' &&
        node scripts/download-node.js &&
        echo 'Step 4: Verify and rebuild better-sqlite3' &&
        NODE_FILE=/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node &&
        NEED_REBUILD=1 &&
        if [ -f \"$$NODE_FILE\" ]; then
          if file \"$$NODE_FILE\" | grep -q 'ELF.*x86-64'; then
            echo 'Valid binary found, skipping rebuild' &&
            NEED_REBUILD=0;
          fi;
        fi &&
        if [ \"$$NEED_REBUILD\" = \"1\" ] || [ \"$$FORCE_REBUILD\" = \"1\" ]; then
          echo 'Rebuilding better-sqlite3' &&
          node scripts/cross-compile-better-sqlite3.mjs --arch=x64;
        fi &&
        echo 'Step 5: Build .deb' &&
        node scripts/build-linux-deb.mjs
      "

volumes:
  zhinengti-uos-node-modules:
  zhinengti-uos-node-resources:
  zhinengti-uos-vite-cache:
  zhinengti-uos-node-gyp-cache:

