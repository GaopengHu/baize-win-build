# 今点通 Windows 7/8 构建环境
#
# 用法:
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm build
#   # 只重打安装包（跳过 npm install / 补丁 / Node 下载 / MCP 打包，源码未变时最省时间）:
#   docker compose -f docker/docker-compose.yml run --rm build sh -c "npm run build:win7"
#
# 缓存策略（首次构建仍然慢，属正常；从第二次构建开始生效提速）:
#   - node_modules / npm 缓存 / Electron 缓存全部走命名卷（ext4），避开 Windows
#     bind mount（9p/drvfs）写小文件慢 10~50 倍的问题
#   - Node.js 运行时包下载到命名卷，跨构建复用（download-node.js 通过
#     NODE_DIST_CACHE 指向该卷）
#   - vite/tsc 构建缓存挂到命名卷，增量构建更快

services:
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: zhinengti-winbuilder:latest
    container_name: zhinengti-build
    working_dir: /app
    # Windows 构建因 NSIS 跨编译需要 root 权限（electron-builder 限制）
    user: 0:0
    volumes:
      # 项目源码 (挂载宿主目录)
      - ..:/app
      # node_modules: 用独立命名卷，避免通过 Windows bind mount 写入宿主磁盘
      # (bind mount 写数万个小文件比 Docker 内部文件系统慢 10~50 倍，是构建慢的根因)
      - baize-node-modules:/app/node_modules
      # npm 缓存 (加速重复构建)
      - baize-npm-cache:/home/builder/.npm
      # npm prebuilds (better-sqlite3等平台二进制)
      - baize-npm-prebuilds:/home/builder/.npm/_prebuilds
      # Electron 缓存
      - baize-electron-cache:/home/builder/.cache/electron
      # electron-builder 缓存
      - baize-builder-cache:/home/builder/.cache/electron-builder
      # Node.js 运行时缓存（download-node.js 下载的各平台 node 包）
      - baize-node-dist-cache:/app/.node-dist-cache
      # vite 构建缓存（renderer/main bundle 增量）
      - baize-vite-cache:/app/node_modules/.vite-build
    environment:
      - INSIDE_DOCKER=true
      - HOME=/home/builder
      - ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
      - ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
      - WINEDEBUG=-all
      # download-node.js 缓存目录指向命名卷，二次构建不再重新下载 node 运行时
      - NODE_DIST_CACHE=/app/.node-dist-cache
      # npm ci 优先：有 lockfile 时跳过依赖树解析，安装更快更稳定
      - NPM_INSTALL_ARGS=--ignore-scripts --no-fund --no-audit --legacy-peer-deps
      # 跳过 GPG 校验（内网环境没有 keyservers）
      - NODEJS_CHECK_SIGNATURES=0
    command: >
      sh -c "
        echo '--- 今点通 Win7 Build Container ---' &&
        if [ -f node_modules/.install-stamp ] && cmp -s package-lock.json node_modules/.install-stamp; then
          echo 'Step 1: npm install SKIPPED (package-lock.json unchanged)';
        else
          echo 'Step 1: npm install (lockfile changed or first run)' &&
          npm install --ignore-scripts --no-fund --no-audit --legacy-peer-deps &&
          npx patch-package &&
          cp package-lock.json node_modules/.install-stamp;
        fi &&
        echo 'Step 2: Download Node.js binaries (cached)' &&
        node scripts/download-node.js &&
        echo 'Step 3: Download Windows better-sqlite3' &&
        npm run prebuild:win &&
        echo 'Step 4: Build MCP bundles' &&
        npm run build:mcp &&
        echo 'Step 5: Build installer' &&
        npm run build:win7 &&
        echo 'Done! Installer at release/今点通-*-win-x64.exe'
      "

volumes:
  baize-node-modules:
  baize-npm-cache:
  baize-npm-prebuilds:
  baize-electron-cache:
  baize-builder-cache:
  baize-node-dist-cache:
  baize-vite-cache:
