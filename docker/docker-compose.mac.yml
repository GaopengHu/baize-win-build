# 今点通 macOS (.dmg) 一键构建
#
# 基于 Dockerfile.mac (Ubuntu 22.04)，在 Linux 上交叉编译 macOS 安装包。
# 使用命名卷隔离 macOS .node 二进制（与 Linux .node 不兼容）。
# 构建产物直接写入宿主 release/ 目录。
#
# 用法:
#   docker-compose -f docker/docker-compose.mac.yml build
#   docker-compose -f docker/docker-compose.mac.yml run --rm build
#   # 只重打 .dmg（lockfile 未变时跳过 npm install）
#   docker-compose -f docker/docker-compose.mac.yml run --rm build sh -c "node scripts/build-macos.mjs"
#

services:
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mac
    image: zhinengti-mac-builder:latest
    container_name: zhinengti-mac-build
    working_dir: /app
    # Use root here to avoid host-mounted workspace permission issues during
    # dist-electron / release writes on different Docker Desktop setups.
    user: root
    volumes:
      # 项目源码 (挂载宿主目录, 构建产物写入宿主 release/)
      - ..:/app
      # node_modules: 用独立命名卷，避免通过 bind mount 写入宿主磁盘（性能瓶颈）
      - zhinengti-node-modules:/app/node_modules
      # npm 缓存 (加速重复构建)
      - zhinengti-npm-cache:/home/builder/.npm
      # npm prebuilds (better-sqlite3 等平台二进制)
      - zhinengti-npm-prebuilds:/home/builder/.npm/_prebuilds
      # Electron 缓存
      - zhinengti-electron-cache:/home/builder/.cache/electron
      # electron-builder 缓存
      - zhinengti-builder-cache:/home/builder/.cache/electron-builder
      # vite 构建缓存（renderer/main bundle 增量）
      - zhinengti-vite-cache:/app/node_modules/.vite-build
    network_mode: host
    environment:
      - INSIDE_DOCKER=true
      - ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
      - ELECTRON_BUILDER_BINARIES_MIRROR=https://github.com/electron-userland/electron-builder-binaries/releases/download/
      # 让 electron-builder 直接使用仓库内的 Linux dmgbuild 包装脚本
      # (scripts/dmgbuild-wrapper.sh, 基于 genisoimage 生成 ISO/HFS 混合镜像)。
      # 绕开 npmmirror 缺失的 dmg-builder bundle（404）以及官方 bundle 内嵌
      # macOS Python 在 Linux 上无法执行的问题（Exec format error）。
      - CUSTOM_DMGBUILD_PATH=/app/.dmgbuild-bundle/dmgbuild
    command: >
      sh -c "
        echo '=== 今点通 macOS Build Container ===' &&
        echo 'Step 0: Prepare Linux dmgbuild wrapper (genisoimage based)' &&
        mkdir -p /app/.dmgbuild-bundle &&
        cp /app/scripts/dmgbuild-wrapper.sh /app/.dmgbuild-bundle/dmgbuild &&
        chmod +x /app/.dmgbuild-bundle/dmgbuild &&
        echo 'dmgbuild wrapper ready:' /app/.dmgbuild-bundle/dmgbuild &&
        if [ -f node_modules/.install-stamp ] && cmp -s package-lock.json node_modules/.install-stamp; then
          echo 'Step 1: npm install SKIPPED (package-lock.json unchanged)';
        else
          echo 'Step 1: npm install (skip postinstall — rebuild is for Linux, not needed for macOS cross-compile)' &&
          npm install --ignore-scripts --no-fund --no-audit --legacy-peer-deps &&
          npx patch-package &&
          cp package-lock.json node_modules/.install-stamp;
        fi &&
        echo 'Step 2: Download Node.js binaries' &&
        node scripts/download-node.js &&
        echo 'Step 3: Download macOS better-sqlite3 binaries' &&
        node scripts/download-mac-better-sqlite3.mjs &&
        echo 'Step 4: Create dmg-license stub (native macOS module, cannot compile on Linux)' &&
        mkdir -p /app/node_modules/dmg-license && echo '{\"main\":\"index.js\"}' > /app/node_modules/dmg-license/package.json && echo 'exports.dmgLicenseFromJSON = async () => {};' > /app/node_modules/dmg-license/index.js &&
        echo 'Step 4.5: Clean stale mac unpack leftovers (avoids EACCES rename errors on bind mounts)' &&
        (rm -rf /app/release/mac-arm64 /app/release/mac || true) &&
        echo 'Step 5: Build .dmg package' &&
        node scripts/build-macos.mjs &&
        echo 'Done! Package at release/今点通-*-mac-*.dmg'
      "

volumes:
  zhinengti-node-modules:
  zhinengti-npm-cache:
  zhinengti-npm-prebuilds:
  zhinengti-electron-cache:
  zhinengti-builder-cache:
  zhinengti-vite-cache:
