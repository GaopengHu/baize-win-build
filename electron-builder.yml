appId: com.zhinengti.app

productName: 今点通
copyright: Copyright © 2026  今点通 Team

directories:
  output: release
  buildResources: resources

npmRebuild: false
afterPack: ./scripts/after-pack.js
afterAllArtifactBuild: ./scripts/compress-dmg.js

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/@img/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/@anthropic-ai/sdk/**/*
  - node_modules/@larksuiteoapi/**/*
  - node_modules/openai/**/*
  - node_modules/@modelcontextprotocol/**/*
  - node_modules/electron-updater/**/*
  - node_modules/chokidar/**/*
  - node_modules/archiver/**/*
  - node_modules/ngrok/**/*
  - node_modules/ws/**/*
  - node_modules/glob/**/*
  - node_modules/dotenv/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  - node_modules/undici/**/*
  - node_modules/node-fetch/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/tr46/**/*
  - node_modules/webidl-conversions/**/*
  # Exclude non-essential files from node_modules to reduce bundle size
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.d.ts.map'
  - '!**/*.mts.map'
  - '!**/*.d.ts'
  - '!**/*.ts'
  - '!**/README.md'
  - '!**/CHANGELOG.md'
  - '!**/CHANGELOG'
  - '!**/LICENSE'
  - '!**/LICENSE.md'
  - '!**/.npmignore'
  - '!**/.eslintrc*'
  - '!**/tsconfig.json'

# MCP servers and platform-specific resources are declared in each platform's
# extraResources section below (win/mac/linux).

# Skills are extracted via extraResources (per-platform) to avoid asar symlink issues.
# Sharp native modules must also be unpacked for image processing.
# Note: MCP servers are bundled with esbuild (all deps inlined), so no need to unpack MCP SDK
asarUnpack:
  - node_modules/@img/**/*.node
  - node_modules/@img/**/*.dll
  - node_modules/@img/**/*.dylib
  - node_modules/@img/**/*.so
  - node_modules/better-sqlite3/**/*.node
  - node_modules/bufferutil/**/*.node
  - node_modules/utf-8-validate/**/*.node

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
  extraResources:
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/win32-x64
      to: node
    - from: resources/node/win32-x64/node_modules/npm
      to: node/node_modules/npm
    - from: dist-wsl-agent
      to: wsl-agent
    - from: resources/platform-config.json
      to: platform-config.json
    - from: .claude/skills
      to: skills
    - from: resources/ffmpeg
      to: ffmpeg
    # Whisper 模型（medium ≈1.5GB）故意不打包：安装体积会从 ~230MB 涨到 ~1.5GB。
    # 运行时若 resourcesPath/whisper-models 不存在，主进程自动回退到
    # userData/models/whisper，asr-transcribe 技能首次转写时经 hf-mirror 下载。
    # 需要完全离线（内网/涉密交付）时，把模型放进 resources/whisper-models/
    # 并临时恢复下面这行即可：
    # - from: resources/whisper-models
    #   to: whisper-models

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 在 Linux 交叉编译时无法签名，设为 null 跳过
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.developer-tools
    NSScreenCaptureUsageDescription: '今点通 needs screen recording access for GUI automation.'
    NSAccessibilityUsageDescription: '今点通 needs accessibility access for GUI automation.'
  extraResources:
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/darwin-${arch}
      to: node
    - from: resources/node/darwin-${arch}/lib/node_modules/npm
      to: node/lib/node_modules/npm
    # Bundled Python runtime + site-packages for GUI automation helpers (Pillow, pyobjc/Quartz)
    - from: resources/python/darwin-${arch}
      to: python
    # Bundled GUI helper tools (e.g. cliclick) to avoid relying on user-installed Homebrew tools
    - from: resources/tools/darwin-${arch}
      to: tools
    - from: dist-lima-agent
      to: lima-agent
    - from: resources/platform-config.json
      to: platform-config.json
    - from: .claude/skills
      to: skills

linux:
  icon: resources/icon-256x256.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  extraResources:
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/linux-${arch}
      to: node
    - from: resources/node/linux-${arch}/lib/node_modules/npm
      to: node/lib/node_modules/npm
    - from: resources/python/linux-${arch}
      to: python
    - from: resources/platform-config.json
      to: platform-config.json
    - from: .claude/skills
      to: skills

deb:
  #electron‑builder 默认 postinst 脚本在 root 下执行`unshare --user`做沙箱判断，该判断在 root 环境永远成功，导致`chrome‑sandbox`权限设置错误。
  #UOS20 默认关闭`unprivileged_userns_clone`，普通用户启动 Electron 直接崩溃。自定义脚本改用 nobody 普通用户实测沙箱能力，按需设置`chrome‑sandbox`权限，并持久化调整内核参数。
  afterInstall: ./scripts/deb-after-install.sh
  afterRemove: ./scripts/deb-after-remove.sh

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  warningsAsErrors: false
  # Preserve user config/history by default; offer explicit cleanup tooling instead of destructive uninstall.
  deleteAppDataOnUninstall: false

dmg:
  # Use solid background color instead of background image (avoids sips call,
  # which is macOS-only and unavailable on Linux cross-compilation).
  backgroundColor: '#ffffff'
  # Explicit size to avoid dmgbuild "No space left on device" for large apps.
  # The temporary writable DMG is auto-shrunk after copying, so this doesn't
  # affect final DMG size. Our ULMO compression hook further reduces it.
  size: '3g'
  window:
    width: 600
    height: 440
  contents:
    - x: 150
      y: 220
      name: '今点通.app'
    - x: 450
      y: 220
      type: link
      path: /Applications
      name: 'Applications'

extraMetadata:
  main: dist-electron/main/index.js

publish:
  provider: github
  owner: OpenCoworkAI
  repo: open-cowork
